name: Resumos ATP Clinic

# 08h, 12h e 18h em Fortaleza (UTC-3). O GitHub pode atrasar alguns minutos.
on:
  schedule:
    - cron: "0 11,15,21 * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Só gerar a prévia, sem enviar no grupo"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pedir o resumo ao painel
        env:
          CRON_KEY: ${{ secrets.CRON_KEY }}
          TESTE: ${{ github.event_name == 'workflow_dispatch' && inputs.teste || 'false' }}
        run: |
          q=""; [ "$TESTE" = "true" ] && q="?dry_run=1"
          code=$(curl -s -o resp.json -w "%{http_code}" --max-time 120 -X POST \
            -H "x-cron-key: $CRON_KEY" "https://atp-painel.triadeflow.workers.dev/api/cron$q")
          echo "HTTP $code"; head -c 400 resp.json; echo
          [ "$code" = "200" ] || [ "$code" = "429" ]

      # O GitHub desliga agendamentos de repositórios sem atividade por 60 dias.
      # Uma vez por mês (dia 1, disparo das 08h) registra um commit para manter ativo.
      - name: Manter o agendamento ativo
        if: github.event_name == 'schedule' && github.event.schedule == '0 11,15,21 * * *'
        uses: actions/checkout@v4
      - name: Commit mensal
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" = "11" ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > ultimo-keepalive.txt
            git config user.name "atp-painel-bot"; git config user.email "bot@users.noreply.github.com"
            git add ultimo-keepalive.txt && git commit -m "chore: keepalive mensal" && git push
          fi
